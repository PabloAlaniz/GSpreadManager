# Nota: en pytest.ini la sección debe llamarse [pytest] ([tool:pytest] es solo para setup.cfg).
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: tests contra la API real de Google (requieren GSPREADMANAGER_TEST_CREDENTIALS)
addopts =
    --cov=gspreadmanager
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
    -v