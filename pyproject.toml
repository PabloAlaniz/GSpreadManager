[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GSpreadManager"
dynamic = ["version"]
description = "Un módulo de Python para gestionar y automatizar tareas en Google Sheets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PabloAlaniz", email = "pablo@culturainteractiva.com" }]
keywords = ["google-sheets", "gspread", "spreadsheet", "automation"]
dependencies = [
    "gspread>=3.0",
    "google-auth>=2.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/PabloAlaniz/GSpreadManager"
Repository = "https://github.com/PabloAlaniz/GSpreadManager"
Documentation = "https://pabloalaniz.github.io/GSpreadManager/"
Changelog = "https://github.com/PabloAlaniz/GSpreadManager/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=1.2.4"]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "pandas>=1.2.4",
]

[tool.setuptools.dynamic]
version = { attr = "gspreadmanager.__version__" }

[tool.setuptools.packages.find]
include = ["gspreadmanager*"]

[tool.setuptools.package-data]
gspreadmanager = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
files = ["gspreadmanager"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.bandit]
exclude_dirs = ["tests"]
