[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GSpreadManager"
dynamic = ["version"]
description = "Un módulo de Python para gestionar y automatizar tareas en Google Sheets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PabloAlaniz", email = "pablo@culturainteractiva.com" }]
keywords = ["google-sheets", "gspread", "spreadsheet", "automation"]
dependencies = [
    "gspread>=3.0",
    "google-auth>=2.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/PabloAlaniz/GSpreadManager"
Repository = "https://github.com/PabloAlaniz/GSpreadManager"
Changelog = "https://github.com/PabloAlaniz/GSpreadManager/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=1.2.4"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "pandas>=1.2.4",
]

[tool.setuptools.dynamic]
version = { attr = "gspreadmanager.__version__" }

[tool.setuptools.packages.find]
include = ["gspreadmanager*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
