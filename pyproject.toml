[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GSpreadManager"
dynamic = ["version"]
description = "Un módulo de Python para gestionar y automatizar tareas en Google Sheets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PabloAlaniz", email = "pablo@culturainteractiva.com" }]
keywords = ["google-sheets", "gspread", "spreadsheet", "automation"]
dependencies = [
    "gspread>=3.0",
    "google-auth>=2.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/PabloAlaniz/GSpreadManager"
Repository = "https://github.com/PabloAlaniz/GSpreadManager"
Documentation = "https://pabloalaniz.github.io/GSpreadManager/"
Changelog = "https://github.com/PabloAlaniz/GSpreadManager/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=1.2.4"]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "pandas>=1.2.4",
]

[tool.setuptools.dynamic]
version = { attr = "gspreadmanager.__version__" }

[tool.setuptools.packages.find]
include = ["gspreadmanager*"]

[tool.setuptools.package-data]
gspreadmanager = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["gspreadmanager", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B",
    "C4",    # comprehensions
    "SIM",   # simplify
    "TID",   # tidy imports
    "PTH",   # pathlib over os.path
    "RET",   # return cleanups
    "ARG",   # unused arguments
    "PIE", "PERF",
    "PL",    # pylint subset
    "RUF",
    "ANN",   # annotations (API público tipado)
    "S",     # seguridad estilo bandit
    "PT",    # pytest style
    "D",     # docstrings
]
ignore = [
    "E501",      # longitud de línea la maneja el formatter
    "ANN401",    # Any es inevitable en el borde con gspread
    "PLR0913",   # métodos de API con muchos parámetros (share/format) son intencionales
    "D203", "D212",  # estilos de docstring mutuamente excluyentes (se usa resumen en 2ª línea)
    "D100", "D104",  # no forzar docstring de módulo/paquete en todos lados
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "D", "PLR2004", "ARG", "S105", "S106"]
"__init__.py" = ["F401"]

[tool.mypy]
# Sin python_version explícito: mypy infiere del intérprete del job de lint.
# La compatibilidad con 3.9 la garantizan ruff (target py39) y la matriz de tests.
files = ["gspreadmanager", "tests"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["gspread.*", "google.*", "pandas.*"]
ignore_missing_imports = true

# El borde con gspread/google-auth (tipos parciales) queda acotado a estos módulos:
# se relajan SOLO aquí los avisos de Any; dominio, puertos y aplicación siguen estrictos.
# connector.py se moverá a infrastructure.* al descomponerse en servicios (Sprint 5).
[[tool.mypy.overrides]]
module = ["gspreadmanager.connector", "gspreadmanager.facade", "gspreadmanager.infrastructure.*"]
warn_return_any = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_any_expr = false

[tool.bandit]
exclude_dirs = ["tests"]
